<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Voxel Flight Lab</title>
    <meta
      name="description"
      content="An interactive museum of fighter jet evolution, with every airframe generated as voxels in code."
    />
    <meta name="theme-color" content="#e9eced" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip" href="#exhibit">Skip to exhibit text</a>
    <canvas id="stage" aria-hidden="true"></canvas>

    <div class="chrome">
      <header class="chrome__top">
        <a class="brand" href="#exhibit" aria-label="Voxel Flight Lab, home">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" focusable="false">
              <path
                fill="currentColor"
                d="M12 2.6 13.3 9l7.4 3.1v1.7l-7.4-1.5-.5 4.4 2.6 1.9v1.3L12 19l-3.4.9v-1.3l2.6-1.9-.5-4.4-7.4 1.5v-1.7L10.7 9 12 2.6Z"
              />
            </svg>
          </span>
          <span class="brand__word">Voxel Flight Lab</span>
        </a>

        <div class="meta">
          <p class="meta__line">Airframe collection<span class="meta__chapter"> · <span data-field="chapter"></span></span></p>
          <p class="meta__line">
            <span class="meta__word">Exhibit </span><span data-field="exhibit">001</span> /
            <span class="meta__country" data-field="country"></span>
          </p>
        </div>
      </header>

      <main class="chrome__main" id="exhibit" tabindex="-1">
        <p class="eyebrow" data-field="category"></p>
        <h1 class="display">
          <span data-field="name">Voxel Flight Lab</span><sup class="display__sup" aria-label="exhibit number"></sup>
        </h1>
        <p class="subtitle">
          <span data-field="subtitle-a"></span>
          <span data-field="subtitle-b"></span>
        </p>
        <div class="colourbar" data-field="colourbar" role="img"></div>
        <div class="sr-only" data-mount="spec"></div>
      </main>

      <section class="chrome__notes" data-mount="notes"></section>

      <button class="inspect" type="button" aria-pressed="false" aria-label="Inspect in 360: free orbit">
        <span class="inspect__label" aria-hidden="true">Inspect in 360</span>
      </button>

      <div class="chrome__tools">
        <div class="chrome__panel" data-mount="panel"></div>
        <nav data-mount="toolbar"></nav>
      </div>

      <footer class="chrome__foot">
        <p class="foot__left">
          <span class="foot__key">Drag</span> rotate
          <span class="foot__key" data-field="zoom-verb">Scroll</span> zoom
        </p>
        <p class="foot__right">
          <span class="foot__dot" aria-hidden="true"></span>
          <span data-field="blocks">0 blocks</span><span class="foot__config"> / flight config A</span>
        </p>
      </footer>

      <p class="sr-only" aria-live="polite" data-field="live"></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
