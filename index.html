<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Voxel Flight Lab</title>
    <meta
      name="description"
      content="An interactive museum of fighter jets, from the first jets of the 1940s to concepts not yet flown, with every airframe built from voxels in code."
    />
    <meta name="theme-color" content="#e9eced" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Voxel Flight Lab" />
    <meta property="og:title" content="Voxel Flight Lab" />
    <meta
      property="og:description"
      content="An interactive museum of fighter jets, from the 1940s to concepts not yet flown, every airframe built from voxels in code."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A voxel model of the VAJRA concept fighter beside the title Voxel Flight Lab." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Voxel Flight Lab" />
    <meta
      name="twitter:description"
      content="An interactive museum of fighter jets, from the 1940s to concepts not yet flown, every airframe built from voxels in code."
    />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <meta name="twitter:image:alt" content="A voxel model of the VAJRA concept fighter beside the title Voxel Flight Lab." />
    <script>
      // The loader is the way in at the introduction, once per tab. Repeat
      // visits, deep links and review views go straight to the page. Decided
      // here, before first paint, so the page never flashes up underneath.
      (function () {
        var skip = /^#ch[1-8]/.test(location.hash) || /[?&](id|gallery|rig)=/.test(location.search);
        try {
          if (sessionStorage.getItem('vfl.entered') === '1') skip = true;
        } catch (e) {}
        document.documentElement.classList.add(skip ? 'is-entered' : 'is-loading');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; text shows in the
         fallback faces for a moment and swaps. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500&display=swap"
      onload="this.onload = null; this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div class="loader" role="dialog" aria-modal="true" aria-labelledby="loader-title">
      <canvas class="loader__wing" aria-hidden="true"></canvas>
      <p class="loader__label" id="loader-title">Calibrating airframe</p>
      <p class="loader__pct" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span data-field="pct">0</span><span class="loader__unit">%</span>
      </p>
      <div class="loader__actions" hidden>
        <button class="loader__btn loader__btn--primary" type="button" data-enter="sound">Enter with sound</button>
        <button class="loader__btn" type="button" data-enter="silence">Enter in silence</button>
      </div>
      <p class="sr-only loader__status" aria-live="polite"></p>
    </div>

    <a class="skip" href="#exhibit">Skip to exhibit text</a>
    <canvas id="stage" aria-hidden="true"></canvas>

    <div class="chrome">
      <header class="chrome__top">
        <a class="brand" href="#exhibit" aria-label="Voxel Flight Lab, home">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" focusable="false">
              <path
                fill="currentColor"
                d="M12 2.6 13.3 9l7.4 3.1v1.7l-7.4-1.5-.5 4.4 2.6 1.9v1.3L12 19l-3.4.9v-1.3l2.6-1.9-.5-4.4-7.4 1.5v-1.7L10.7 9 12 2.6Z"
              />
            </svg>
          </span>
          <span class="brand__word">Voxel Flight Lab</span>
        </a>

        <nav data-mount="ribbon"></nav>

        <div class="meta">
          <p class="meta__line">Airframe collection<span class="meta__chapter"> · <span data-field="chapter"></span></span></p>
          <p class="meta__line">
            <span class="meta__word">Exhibit </span><span data-field="exhibit">001</span> /
            <span class="meta__country" data-field="country"></span>
          </p>
        </div>
      </header>

      <main class="chrome__main" id="exhibit" tabindex="-1">
        <p class="eyebrow" data-field="category"></p>
        <h1 class="display">
          <span data-field="name">Voxel Flight Lab</span><sup class="display__sup"></sup>
        </h1>
        <p class="subtitle">
          <span data-field="subtitle-a"></span>
          <span data-field="subtitle-b"></span>
        </p>
        <div class="colourbar" data-field="colourbar" role="img"></div>
        <div class="sr-only" data-mount="spec"></div>
      </main>

      <section class="chrome__notes" data-mount="notes"></section>

      <button class="inspect" type="button" aria-pressed="false" aria-label="Inspect in 360: free orbit">
        <span class="inspect__label" aria-hidden="true">Inspect in 360</span>
      </button>

      <div class="chrome__tools">
        <div class="chrome__panel" data-mount="panel"></div>
        <nav data-mount="toolbar"></nav>
      </div>

      <footer class="chrome__foot">
        <p class="foot__left">
          <span class="foot__scroll"><span class="foot__key" data-field="scroll-verb">Scroll</span> chapters</span>
          <span class="foot__arrows"><span class="foot__key">← →</span> aircraft</span>
          <span class="foot__egg" data-field="egg">Psst — hold Space.</span>
        </p>
        <p class="foot__legal">Design concept · not affiliated with any manufacturer or air force · approximate public figures</p>
        <p class="foot__right">
          <span class="foot__dot" aria-hidden="true"></span>
          <span data-field="blocks">0 blocks</span><span class="foot__config"> / flight config A</span>
        </p>
      </footer>

      <p class="sr-only" aria-live="polite" data-field="live"></p>
    </div>

    <!-- After the chrome in the document, so the keyboard reaches the header,
         ribbon and toolbar before the chapter text. -->
    <div data-mount="chapters"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
